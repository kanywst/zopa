name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: zig build (debug)
        run: zig build

      - name: zig build (release-small)
        run: zig build --release=small

      - name: report wasm size
        run: |
          ls -l zig-out/bin/zopa.wasm
          wc -c zig-out/bin/zopa.wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          name: zopa.wasm
          path: zig-out/bin/zopa.wasm
          if-no-files-found: error

  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: zig build test-unit
        run: zig build test-unit

  bench:
    name: bench (smoke)
    runs-on: ubuntu-latest
    # No `needs: build` -- `zig build bench` rebuilds the wasm via
    # the install step, so depending on the artifact job adds wait
    # time without saving work.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: zig build bench
        run: zig build bench

  test-node:
    name: test (node)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: zig build test
        run: zig build test

  test-wasmtime:
    name: test (wasmtime)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: install python deps
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install -r test/requirements.txt

      - name: zig build test-wasmtime
        run: zig build test-wasmtime

  test-envoy:
    name: test (envoy)
    runs-on: ubuntu-latest
    needs: build
    # The only job that exercises the proxy-wasm ABI itself: configure,
    # the three phase callbacks, body buffering, send_local_response.
    # Everything else calls `evaluate` directly and would keep passing
    # if the shim were broken.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: install envoy
        env:
          ENVOY_VERSION: "1.39.0"
          ENVOY_SHA256: "4409dadc87931d8f8676314cbd83071cb65125fb4feac3f6335800580dfa9218"
        run: |
          set -euo pipefail
          url="https://github.com/envoyproxy/envoy/releases/download/v${ENVOY_VERSION}/envoy-${ENVOY_VERSION}-linux-x86_64"
          curl -fsSL -o /tmp/envoy "$url"
          echo "${ENVOY_SHA256}  /tmp/envoy" | sha256sum -c -
          sudo install -m 0755 /tmp/envoy /usr/local/bin/envoy
          envoy --version

      - name: zig build test-envoy
        env:
          # The upstream release binary ships V8, not the wamr runtime
          # Homebrew builds with.
          ZOPA_ENVOY_RUNTIME: envoy.wasm.runtime.v8
        run: zig build test-envoy

  test-conformance:
    name: test (conformance)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: install opa
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.16.1/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: install python deps
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install -r test/requirements.txt

      - name: zig build test-conformance
        run: zig build test-conformance
