# OCI image flow:
#   1. push to main -> build + push :edge (multi-arch)
#   2. tag v* -> build + push :v<tag> and update :latest
#   3. cosign keyless signs the image manifest
#
# secrets: none. credentials are minted via OIDC per run.

name: oci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  image:
    name: build + push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr (push events only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive tags
        id: tags
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            echo "tags=${repo}:${tag},${repo}:latest" >>"$GITHUB_OUTPUT"
          else
            echo "tags=${repo}:edge" >>"$GITHUB_OUTPUT"
          fi

      - name: build (and push for non-PR events)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      - name: install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: cosign sign manifest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IFS=',' read -ra refs <<<"$TAGS"
          # The public Rekor log occasionally rejects or drops the upload
          # ("POST .../log/entries giving up after 2 attempt(s)"), which left
          # an already-pushed :edge unsigned on 2026-11-07. Retry with a fresh
          # keyless signature instead of failing the run on one bad request.
          for ref in "${refs[@]}"; do
            for attempt in 1 2 3 4; do
              if cosign sign --yes "${ref}@${DIGEST}"; then
                continue 2
              fi
              if [ "${attempt}" -lt 4 ]; then
                echo "cosign sign failed for ${ref} (attempt ${attempt}), retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              fi
            done
            echo "::error::cosign sign failed for ${ref} after 4 attempts"
            exit 1
          done
