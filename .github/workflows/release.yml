# release flow:
#   1. tag v* on main triggers this workflow
#   2. build job produces zopa.wasm (--release=small) + sha256 and exposes
#      base64 subjects for the slsa-github-generator
#   3. provenance job generates SLSA v1.0 attestation via the reusable workflow
#      (runs in an isolated builder, uploads the intoto.jsonl to the release)
#   4. sign job runs cosign sign-blob keylessly over the wasm and the
#      SBOM, and attaches both bundles
#   5. release job attaches the wasm + sha256 + SBOM to the GitHub Release
#
# secrets used: none. credentials are minted via OIDC per run.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build wasm + checksum
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      wasm-name: ${{ steps.pack.outputs.wasm-name }}
      wasm-sha256: ${{ steps.pack.outputs.wasm-sha256 }}
      subjects-base64: ${{ steps.pack.outputs.subjects-base64 }}
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: build (release-small)
        run: zig build --release=small

      - name: pack
        id: pack
        run: |
          set -euo pipefail
          src="zig-out/bin/zopa.wasm"
          name="zopa-${GITHUB_REF_NAME}.wasm"
          cp "$src" "$name"
          sha=$(shasum -a 256 "$name" | awk '{print $1}')
          printf '%s  %s\n' "$sha" "$name" > "$name.sha256"
          subjects=$(printf '%s  %s\n' "$sha" "$name" | base64 -w0)
          echo "wasm-name=$name"           >>"$GITHUB_OUTPUT"
          echo "wasm-sha256=$sha"          >>"$GITHUB_OUTPUT"
          echo "subjects-base64=$subjects" >>"$GITHUB_OUTPUT"
          ls -l "$name" "$name.sha256"
          wc -c "$name"

      # Scanned against the built artifact, not the source tree. A
      # `dir:.` scan of this repo reports 60-odd components -- the
      # GitHub Actions pinned in .github/workflows, plus false positives
      # syft reads out of .zig-cache -- none of which the shipped wasm
      # depends on. Scanning the wasm reports zero components, which is
      # the true answer: build.zig.zon declares no dependencies and the
      # module is stdlib-only.
      #
      # An SBOM that says "nothing" is still worth publishing. It says it
      # in a format a scanner already ingests, and it carries the
      # artifact's hash, licence and toolchain alongside.
      - name: generate sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.pack.outputs.wasm-name }}
          format: cyclonedx-json
          output-file: ${{ steps.pack.outputs.wasm-name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # syft names the file it scanned and the version of itself; it
      # cannot know what compiled the thing, what licence it carries, or
      # where it came from. Without this the document is technically
      # valid and practically useless.
      - name: describe the subject in the sbom
        # Both values reach the shell through `env`, never through `${{ }}`
        # splicing. An expression is substituted into the script as raw
        # text before any shell parses it, and `wasm-name` embeds
        # GITHUB_REF_NAME -- git permits `$`, backticks, `;` and `(` `)`
        # in a tag, and a tag matching `v*` triggers this workflow into a
        # job holding `id-token: write`. `pack` above already uses the
        # safe idiom.
        env:
          WASM_NAME: ${{ steps.pack.outputs.wasm-name }}
          WASM_SHA256: ${{ steps.pack.outputs.wasm-sha256 }}
        run: |
          set -euo pipefail
          sbom="${WASM_NAME}.cdx.json"
          tmp=$(mktemp)
          jq --arg zig "$(zig version)" \
             --arg sha "$WASM_SHA256" \
             --arg ver "${GITHUB_REF_NAME}" '
            # CycloneDX moved metadata.tools from an array to an object
            # with a components list; accept either so a syft upgrade
            # cannot silently break this. Pre-1.5 entries are bare
            # vendor/name/version tools with no `type`, which the
            # component schema requires -- backfill it, or the
            # compatibility branch would emit a document that fails
            # stricter validation while every check here still passed.
            (.metadata.tools) |= (
              if type == "array"
              then {"components": [.[] | {type: "application"} + .]}
              else . end
            )
            | .metadata.tools.components += [{
                "type": "application", "name": "zig", "version": $zig
              }]
            | .metadata.component = {
                "type": "library",
                "name": "zopa",
                "version": $ver,
                "description": "Authorization engine for proxy-wasm, compiled to wasm32-freestanding",
                "licenses": [{"license": {"id": "Apache-2.0"}}],
                "hashes": [{"alg": "SHA-256", "content": $sha}],
                "externalReferences": [{"type": "vcs", "url": "https://github.com/kanywst/zopa"}]
              }' "$sbom" > "$tmp"
          mv "$tmp" "$sbom"

          # Fail the release rather than publish an SBOM that describes
          # the wrong bytes. The hash is recomputed from the artifact on
          # disk rather than reusing the `pack` output: Actions
          # substitutes that expression into both the write above and any
          # check here, so comparing it to itself would pass even if the
          # wasm had been replaced in between, which is the only scenario
          # worth guarding.
          actual=$(shasum -a 256 "$WASM_NAME" | awk '{print $1}')
          recorded=$(jq -r '.metadata.component.hashes[] | select(.alg == "SHA-256") | .content' "$sbom")
          if [ "$actual" != "$recorded" ]; then
            echo "sbom records $recorded but $WASM_NAME hashes to $actual" >&2
            exit 1
          fi
          jq -e '.metadata.tools.components[] | select(.name == "zig")' "$sbom" >/dev/null
          echo "sbom: $(jq -r '.specVersion' "$sbom"), $(jq '.components | length' "$sbom") dependency component(s)"

      - name: upload wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: |
            ${{ steps.pack.outputs.wasm-name }}
            ${{ steps.pack.outputs.wasm-name }}.sha256
            ${{ steps.pack.outputs.wasm-name }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: slsa v1.0 provenance
    needs: [build]
    permissions:
      actions: read
      contents: write
      id-token: write
    # exception: slsa-github-generator reusable workflows MUST be referenced by tag,
    # not sha. internally this ref is parsed as `refs/tags/vX.Y.Z` to fetch the
    # pre-built builder binary from the matching release. sha pinning makes the
    # binary download fail with "Invalid ref ... Expected ref of the form
    # refs/tags/vX.Y.Z". see https://github.com/slsa-framework/slsa-github-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.subjects-base64 }}
      provenance-name: ${{ needs.build.outputs.wasm-name }}.intoto.jsonl
      upload-assets: true

  sign:
    name: cosign sign-blob (keyless)
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm

      - name: sign
        # cosign v4 emits a single sigstore bundle (.sigstore.json) by default;
        # --output-signature / --output-certificate are deprecated and ignored.
        #
        # The SBOM is signed too. An unsigned SBOM beside a signed
        # artifact is worth little: anyone who can substitute the
        # document can claim the build pulled in whatever they like.
        #
        # Via `env` for the same reason as the sbom step: this job holds
        # contents: write and id-token: write, so a tag name reaching the
        # shell as raw text would run with the identity that signs the
        # release.
        env:
          WASM_NAME: ${{ needs.build.outputs.wasm-name }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${WASM_NAME}.sigstore.json" \
            "$WASM_NAME"
          cosign sign-blob --yes \
            --bundle "${WASM_NAME}.cdx.json.sigstore.json" \
            "${WASM_NAME}.cdx.json"

      - name: attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ needs.build.outputs.wasm-name }}
            ${{ needs.build.outputs.wasm-name }}.sha256
            ${{ needs.build.outputs.wasm-name }}.sigstore.json
            ${{ needs.build.outputs.wasm-name }}.cdx.json
            ${{ needs.build.outputs.wasm-name }}.cdx.json.sigstore.json
          fail_on_unmatched_files: true
          generate_release_notes: true
